<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="Portfolio of Michael Covelli — SQL Developer, Data & Business Analyst. Database, pipeline, and data visualization projects.">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="Portfolio of Michael Covelli — SQL Developer, Data & Business Analyst. Database, pipeline, and data visualization projects.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:image" content="https://github.com/mcovelli.png">
  <link rel="icon" href="https://github.com/mcovelli.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WR67PSJG2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-1WR67PSJG2');

    (function () {
      var hasInteracted = false;
      var noInteractionSent = false;

      // Turns link text/urls into a short, GA4-safe event-name suffix
      // (letters/numbers/underscores, starts with a letter, capped length).
      function slugify(str, maxLen) {
        var s = (str || '')
          .replace(/([a-z0-9])([A-Z])/g, '$1_$2')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '_')
          .replace(/^_+|_+$/g, '')
          .slice(0, maxLen || 28);
        return s || 'link';
      }

      // Gives each known link its own event name, so GA4's default Events
      // report breaks clicks down link-by-link with zero extra setup.
      function classifyLink(link, url) {
        if (link.hasAttribute('download') || /\.pdf$/i.test(url)) {
          return { event: 'resume_download', params: {} };
        }
        var repoMatch = url.match(/github\.com\/mcovelli\/([^\/\s?#]+)/i);
        if (repoMatch && repoMatch[1]) {
          return {
            event: 'project_click_' + slugify(repoMatch[1], 26),
            params: { project_name: repoMatch[1] }
          };
        }
        if (/linkedin\.com/i.test(url)) {
          return { event: 'social_click_linkedin', params: { platform: 'LinkedIn' } };
        }
        if (/github\.com\/mcovelli\/?\s*$/i.test(url)) {
          return { event: 'social_click_github', params: { platform: 'GitHub' } };
        }
        if (/^mailto:/i.test(url)) {
          return { event: 'social_click_email', params: { platform: 'Email' } };
        }
        return null;
      }

      function initLinkTracking() {
        document.querySelectorAll('a[href]').forEach(function (link) {
          var url = link.getAttribute('href');
          if (!url) return;

          // Open external links in a new tab so visitors don't lose the portfolio.
          try {
            var isExternal = /^https?:\/\//i.test(url) && new URL(url, location.href).origin !== location.origin;
            if (isExternal && !link.hasAttribute('target')) {
              link.setAttribute('target', '_blank');
              link.setAttribute('rel', 'noopener noreferrer');
            }
          } catch (e) {}

          link.addEventListener('click', function () {
            hasInteracted = true;
            var linkText = (link.textContent || link.getAttribute('aria-label') || '')
              .trim().replace(/\s+/g, ' ').slice(0, 100);

            var specific = classifyLink(link, url);
            var namedEvent = specific ? specific.event : 'link_click_' + slugify(linkText || url, 28);
            var params = Object.assign(
              { link_url: url, link_text: linkText, transport: 'beacon' },
              specific ? specific.params : {}
            );

            // Per-link event, e.g. project_click_nyc_transit_weather — shows
            // up as its own row in GA4's Events report, no config needed.
            gtag('event', namedEvent, params);

            // Stable catch-all so totals still work even as links change.
            gtag('event', 'link_click', { link_url: url, link_text: linkText, transport: 'beacon' });
          });
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLinkTracking);
      } else {
        initLinkTracking();
      }

      // Any click at all (not just links) counts as interaction.
      document.addEventListener('click', function () { hasInteracted = true; }, { capture: true });

      // If the visitor leaves without ever clicking anything, log it once.
      function reportIfIdle() {
        if (hasInteracted || noInteractionSent) return;
        noInteractionSent = true;
        gtag('event', 'no_interaction_visit', { transport: 'beacon' });
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') reportIfIdle();
      });
      window.addEventListener('pagehide', reportIfIdle);
    })();
  </script>
</head>
<body>

  <main class="portfolio-container">
    {{ content }}
  </main>

</body>
</html>
