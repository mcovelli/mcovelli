<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="Portfolio of Michael Covelli — entry-level data & business analyst. SQL, Python, and data visualization projects.">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="Portfolio of Michael Covelli — entry-level data & business analyst. SQL, Python, and data visualization projects.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:image" content="https://github.com/mcovelli.png">
  <link rel="icon" href="https://github.com/mcovelli.png">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WR67PSJG2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-1WR67PSJG2');

    (function () {
      var hasInteracted = false;
      var noInteractionSent = false;

      // Decide whether a click also deserves a more specific, named event
      // on top of the catch-all link_click below (nicer GA4 reports).
      function classifyLink(link, url) {
        if (link.hasAttribute('download') || /\.pdf$/i.test(url)) {
          return { event: 'resume_download', params: {} };
        }
        var repoMatch = url.match(/github\.com\/mcovelli\/([^\/\s?#]+)/i);
        if (repoMatch && repoMatch[1]) {
          return { event: 'project_click', params: { project_name: repoMatch[1] } };
        }
        if (/linkedin\.com/i.test(url)) {
          return { event: 'social_click', params: { platform: 'LinkedIn' } };
        }
        if (/github\.com\/mcovelli\/?\s*$/i.test(url)) {
          return { event: 'social_click', params: { platform: 'GitHub' } };
        }
        return null;
      }

      function initLinkTracking() {
        document.querySelectorAll('a[href]').forEach(function (link) {
          var url = link.getAttribute('href');
          if (!url) return;

          // Open external links in a new tab so visitors don't lose the portfolio.
          try {
            var isExternal = /^https?:\/\//i.test(url) && new URL(url, location.href).origin !== location.origin;
            if (isExternal && !link.hasAttribute('target')) {
              link.setAttribute('target', '_blank');
              link.setAttribute('rel', 'noopener noreferrer');
            }
          } catch (e) {}

          link.addEventListener('click', function () {
            hasInteracted = true;
            var linkText = (link.textContent || link.getAttribute('aria-label') || '').trim().slice(0, 100);

            // Every single link click is tracked here, categorized or not.
            gtag('event', 'link_click', {
              link_url: url,
              link_text: linkText,
              transport: 'beacon'
            });

            var specific = classifyLink(link, url);
            if (specific) {
              var params = Object.assign({ link_url: url, transport: 'beacon' }, specific.params);
              gtag('event', specific.event, params);
            }
          });
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLinkTracking);
      } else {
        initLinkTracking();
      }

      // Any click at all (not just links) counts as interaction.
      document.addEventListener('click', function () { hasInteracted = true; }, { capture: true });

      // If the visitor leaves without ever clicking anything, log it once.
      function reportIfIdle() {
        if (hasInteracted || noInteractionSent) return;
        noInteractionSent = true;
        gtag('event', 'no_interaction_visit', { transport: 'beacon' });
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') reportIfIdle();
      });
      window.addEventListener('pagehide', reportIfIdle);
    })();
  </script>
</head>
<body>

  <main class="portfolio-container">
    {{ content }}
  </main>

</body>
</html>
